    <path d="M825 528c-44 46-70 82-77 117 39-16 72-30 105-59" fill="none" stroke="#8df0c1" stroke-width="17" stroke-linecap="round"/>
    <path d="M930 527c22 48 31 80 24 111-27-17-50-37-65-61" fill="none" stroke="#73e5b2" stroke-width="15" stroke-linecap="round"/>
    <ellipse cx="866" cy="433" rx="10" ry="14" fill="#263956"/>
    <ellipse cx="931" cy="431" rx="10" ry="14" fill="#263956"/>
    <path d="M881 470c13 12 26 12 39 0" fill="none" stroke="#326a68" stroke-width="7" stroke-linecap="round"/>
    <circle cx="834" cy="390" r="8" fill="#fff8c9" opacity=".9"/>
    <circle cx="964" cy="475" r="6" fill="#fff8c9" opacity=".8"/>
    <path d="M1037 555c30-29 50-61 61-95M1030 573c40-6 76-22 106-47" fill="none" stroke="#ffcf79" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    <path d="M99 235l11 21 23 4-17 16 4 24-21-12-21 12 4-24-17-16 23-4z" fill="#ffcf79" opacity=".75"/>
  </g>
</svg>